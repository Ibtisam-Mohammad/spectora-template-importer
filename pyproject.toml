[project]
name = "spectora-importer"
version = "0.1.0"
description = "Import Spectora HTML-text template exports into an editable, persistent template library."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "defusedxml>=0.7",
    "nh3>=0.3.7",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8.4",
    "ruff>=0.13",
    "uvicorn>=0.37",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -q"
markers = [
    "rule(*ids): the rules from docs/rules.md that this test verifies",
    "database: needs TEST_DATABASE_URL",
    "holdout: runs against fixtures/holdout, only with --holdout",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tools", "app/web/static"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
