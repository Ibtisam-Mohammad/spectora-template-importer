<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>{% block title %}Template importer{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  {% block head %}{% endblock %}
  <script src="{{ url_for('static', path='htmx.min.js') }}"></script>
  <script>
    htmx.config.historyRestoreAsHxRequest = false;
    htmx.config.historyCacheSize = 0;
    htmx.config.defaultSettleDelay = 0;
  </script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/">Template importer</a>
    {% block topbar %}{% endblock %}
  </header>
  <main>{% block main %}{% endblock %}</main>
</body>
</html>
